# Builds real, downloadable Rexo binaries for supported platforms
# and attaches them to a GitHub Release.
#
# Triggered by pushing a tag like `v0.7.3`.
# Each matrix leg builds on its native OS runner and produces
# a platform-specific archive containing:
#   rexo(.exe), README.md, LICENSE, and the matching install script.
#
# Windows packages also include:
#   rexo.ico + windows-terminal-profile.json
#
# Current release targets:
#   - Linux x86_64
#   - macOS Apple Silicon (ARM64)
#   - Windows x86_64
#   - Windows ARM64

name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.7.3)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: rexo

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

          # macOS Apple Silicon
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz

          # Windows x86_64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

          # Windows ARM64
          - name: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      # -------------------------
      # Unix package
      # -------------------------
      - name: Stage package contents (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          STAGE="stage/rexo-code-${{ matrix.name }}"

          mkdir -p "$STAGE"

          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          cp install.sh uninstall.sh "$STAGE/"

          chmod +x \
            "$STAGE/${BIN_NAME}" \
            "$STAGE/install.sh" \
            "$STAGE/uninstall.sh"

          tar \
            -C stage \
            -czf "rexo-code-${{ matrix.name }}.tar.gz" \
            "rexo-code-${{ matrix.name }}"

      # -------------------------
      # Windows package
      # -------------------------
      - name: Stage package contents (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Stage = "stage/rexo-code-${{ matrix.name }}"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $Stage | Out-Null

          Copy-Item `
            "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" `
            $Stage

          Copy-Item `
            README.md,
            LICENSE,
            install.ps1,
            install.bat,
            uninstall.ps1 `
            $Stage

          Copy-Item `
            assets/rexo.ico,
            assets/windows-terminal-profile.json `
            $Stage

          Compress-Archive `
            -Path "$Stage/*" `
            -DestinationPath "rexo-code-${{ matrix.name }}.zip"

      # -------------------------
      # Upload build artifact
      # -------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rexo-code-${{ matrix.name }}
          path: rexo-code-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  # -------------------------
  # Publish GitHub Release
  # -------------------------
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          sha256sum \
            rexo-code-* \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/rexo-code-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
